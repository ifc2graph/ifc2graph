site_name: ifc2graph
site_description: Convert an IFC model into a graph.
site_url: https://ifc2graph.github.io/ifc2graph/
copyright: Copyright &copy; 2026 ifc2graph contributors
repo_url: https://github.com/ifc2graph/ifc2graph


nav:
  - Home: index.md
  - Installation: installation.md
  - Graph Schema: graph.md
  - Examples: querying.md
  - API Reference: api.md
  - License: license-dependencies.md

theme:
  name: material
  logo: images/ifc2graph.png
  favicon: images/ifc2graph.png
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - navigation.footer


plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            heading_level: 2
            filters: ["!^_"]


extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true

watch:
  - src

extra:
  generator: false